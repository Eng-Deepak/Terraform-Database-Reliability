services:
  postgres:
    image: postgres:16
    container_name: assessment-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: localpass123
      POSTGRES_DB: bookings

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d bookings"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
